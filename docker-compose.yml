services:
  linkmanager:
    image: ghcr.io/alexbaril1410-stack/linkmanager:latest
    container_name: linkmanager
    restart: unless-stopped
    init: true
    group_add:
      - "1000"
    ports:
      - "8088:8080"
    environment:
      MEDIA_ROOT: /media
      LINKMANAGER_USER: "admin"
      # À remplacer par un mot de passe long et unique avant le déploiement.
      LINKMANAGER_PASSWORD: "CHANGE-ME-TO-A-LONG-RANDOM-PASSWORD"
      ALLOW_LINK_CREATION: "true"
      MAX_LIST_ITEMS: "1000"
      LOG_LEVEL: "INFO"
      # Cache persistant des inventaires (TTL des listes qBittorrent/Radarr/Sonarr).
      LINKMANAGER_DB_PATH: "/app/data/linkmanager.sqlite3"
      INVENTORY_CACHE_TTL_SECONDS: "300"
      # Intégrations facultatives : renseigner les URL accessibles depuis le conteneur LinkManager.
      # Les identifiants restent côté serveur et ne sont jamais envoyés au navigateur.
      QBITTORRENT_URL: ""
      QBITTORRENT_USERNAME: ""
      QBITTORRENT_PASSWORD: ""
      RADARR_URL: ""
      RADARR_API_KEY: ""
      SONARR_URL: ""
      SONARR_API_KEY: ""
      # Correspondance chemin-conteneur -> chemin visible par LinkManager (/media est la racine).
      # Adapter ces chemins si les montages Docker de tes applications changent.
      QBITTORRENT_PATH_MAP: '[{"remote":"/data/Téléchargements/temp","local":"/HDD500/Téléchargements"},{"remote":"/data/Téléchargements","local":"/SSD2TO/Téléchargements"},{"remote":"/data/Seedb","local":"/HDD500/Téléchargements"},{"remote":"/data/Seed","local":"/HDD1TO"},{"remote":"/Seedc","local":"/RAID480"},{"remote":"/Seedd","local":"/SSD 240GB"},{"remote":"/data/Films","local":"/SSD2TO/Films"},{"remote":"/data/Séries","local":"/SSD2TO/Séries"},{"remote":"/data/Audiobooks","local":"/SSD2TO/Audiobooks"}]'
      RADARR_PATH_MAP: '[{"remote":"/seedb","local":"/HDD500"},{"remote":"/Seedc","local":"/RAID480"},{"remote":"/Seedd","local":"/SSD 240GB"},{"remote":"/seed","local":"/HDD1TO"},{"remote":"/data","local":"/SSD2TO"}]'
      SONARR_PATH_MAP: '[{"remote":"/seedb","local":"/HDD500"},{"remote":"/Seedc","local":"/RAID480"},{"remote":"/Seedd","local":"/SSD 240GB"},{"remote":"/seed","local":"/HDD1TO"},{"remote":"/data","local":"/SSD2TO"}]'
    volumes:
      # Remplacer par le chemin hôte commun des médias et téléchargements.
      - type: bind
        source: /path/on/host/media
        target: /media
        bind:
          create_host_path: false
      - linkmanager_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - linkmanager_net

volumes:
  linkmanager_data:

networks:
  linkmanager_net:
    driver: bridge
